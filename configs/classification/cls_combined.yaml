# Scenario A4 - union of all classes, 20 classes. class_names must match
# src/class_mapping.py::CANONICAL_CLASSES exactly.
experiment_name: "classification/combined"

dataset:
  name: combined
  root: data/combined/classification
  num_classes: 20
  class_names:
    - inclusion                     # merged: NEU + GC10 + XSDD(slag_inclusion)
    - scratches                     # merged: NEU + XSDD(surface_scratches)
    - crazing
    - patches
    - pitted_surface
    - rolled-in_scale
    - punching_hole
    - weld_line
    - crescent_gap
    - water_spot
    - oil_spot
    - silk_spot
    - waist_folding
    - crease
    - rolled_pit
    - red_iron_sheet
    - iron_sheet_ash
    - oxide_scale_of_plate_system
    - oxide_scale_of_temperature
    - finishing_roll_printing

img_size: 224
batch_size: 32
num_workers: 4
epochs: 60
seed: 42

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00001

scheduler:
  name: cosine

loss:
  weighted: true          # merged classes have more samples than dataset-unique ones
  label_smoothing: 0.1

head:
  type: mlp
  hidden_dim: 512
  dropout: 0.3
  use_batchnorm: true

quantization:
  enabled: true
  backend: qnnpack
  qat_start_epoch: 42
  freeze_observer_epoch: 48
  freeze_bn_stats_epoch: 55

early_stopping:
  patience: 12
  metric: f1_macro

architectures:
  - resnet50
  - efficientnetv2_s
  - convnext_tiny
  - mobilenetv3

output_dir: results/classification/combined
