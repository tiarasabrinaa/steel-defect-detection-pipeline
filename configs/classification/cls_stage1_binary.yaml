# Stage 1: binary gate classifier, Defect vs Normal.
# class_names order is [Normal, Defect].
experiment_name: "steel-defect/classification/stage1_binary"

dataset:
  name: stage1_binary
  root: data/combined/stage1_binary
  num_classes: 2
  class_names:
    - Normal
    - Defect

img_size: 224
batch_size: 64
num_workers: 4
epochs: 30
seed: 42

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00001

scheduler:
  name: cosine

loss:
  weighted: false
  label_smoothing: 0.1

# MLP head: Normal is 100% Severstal and Defect is 100% the other sources,
# so a linear head could shortcut on source identity instead of texture.
head:
  type: mlp
  hidden_dim: 512
  dropout: 0.3
  use_batchnorm: true

quantization:
  enabled: true
  backend: qnnpack
  qat_start_epoch: 21
  freeze_observer_epoch: 26
  freeze_bn_stats_epoch: 28

early_stopping:
  patience: 8
  metric: recall_per_class.Defect

architectures:
  - resnet18
  - mobilenetv3_small
  - efficientnetv2_s

output_dir: results/classification/stage1_binary
