# Scenario A2 (README.md section 3) - NEU-CLS only, 6 classes.
experiment_name: "classification/neu_cls"

dataset:
  name: neu_cls
  root: data/processed/neu_cls
  num_classes: 6
  class_names:
    - crazing
    - inclusion
    - patches
    - pitted_surface
    - rolled-in_scale
    - scratches

img_size: 224
batch_size: 32
num_workers: 4
epochs: 50
seed: 42

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00001

scheduler:
  name: cosine

loss:
  weighted: false        # NEU-CLS is balanced by design (300 images/class)
  label_smoothing: 0.1

# Small dataset (300 images/class) - MLP head as a regularizer.
head:
  type: mlp
  hidden_dim: 256
  dropout: 0.3
  use_batchnorm: true

quantization:
  enabled: true
  backend: qnnpack
  qat_start_epoch: 35
  freeze_observer_epoch: 40
  freeze_bn_stats_epoch: 45

early_stopping:
  patience: 10
  metric: f1_macro

architectures:
  - resnet50
  - efficientnetv2_s
  - convnext_tiny
  - mobilenetv3

output_dir: results/classification/neu_cls
