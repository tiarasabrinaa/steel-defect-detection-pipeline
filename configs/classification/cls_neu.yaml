# Skenario A2 (README.md bagian 3) - NEU-CLS saja, 6 kelas.
experiment_name: "steel-defect/classification/neu_cls"

dataset:
  name: neu_cls
  root: data/processed/neu_cls
  num_classes: 6
  class_names:
    - crazing
    - inclusion
    - patches
    - pitted_surface
    - rolled-in_scale
    - scratches

img_size: 224
batch_size: 32
num_workers: 4
epochs: 50
seed: 42

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00001

scheduler:
  name: cosine

loss:
  weighted: false        # NEU-CLS balanced (300 gambar/kelas by design)
  label_smoothing: 0.1

# NEU-CLS cuma 300 gambar/kelas (jauh lebih kecil dari GC10) - Linear head
# langsung di atas pooled feature 2048-dim (resnet50) gampang overfit di
# regime data sekecil ini. Bottleneck MLP (512-dim) + dropout 0.3 jadi
# regularizer murah: paksa model belajar representasi defect yang lebih
# ringkas sebelum keputusan kelas, bukan menghafal 300 sampel/kelas.
head:
  type: mlp
  hidden_dim: 256
  dropout: 0.3
  use_batchnorm: true

# Sama seperti cls_gc10.yaml (lihat penjelasan di sana). qat_start_epoch
# tetap 35/50 karena epoch budget sama; dataset NEU-CLS kecil jadi observer
# QAT butuh beberapa epoch stabil dulu sebelum di-freeze.
quantization:
  enabled: true
  backend: qnnpack
  qat_start_epoch: 35
  freeze_observer_epoch: 40
  freeze_bn_stats_epoch: 45

early_stopping:
  patience: 10
  metric: f1_macro

architectures:
  - resnet50
  - efficientnetv2_s
  - convnext_tiny
  - mobilenetv3

output_dir: results/classification/neu_cls
