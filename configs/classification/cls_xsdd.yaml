# Scenario A3 (README.md section 3) - X-SDD only, 7 classes.
experiment_name: "steel-defect/classification/xsdd"

dataset:
  name: xsdd
  root: data/processed/xsdd
  num_classes: 7
  class_names:
    - slag_inclusion
    - red_iron_sheet
    - iron_sheet_ash
    - surface_scratches
    - oxide_scale_of_plate_system
    - finishing_roll_printing
    - oxide_scale_of_temperature

img_size: 224
batch_size: 32
num_workers: 4
epochs: 50
seed: 42

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00001

scheduler:
  name: cosine

loss:
  weighted: true         # X-SDD: 1,360 images / 7 classes, distribution is uneven
  label_smoothing: 0.1

# Smallest, most imbalanced dataset of the three - higher dropout than NEU.
head:
  type: mlp
  hidden_dim: 256
  dropout: 0.4
  use_batchnorm: true

quantization:
  enabled: true
  backend: qnnpack
  qat_start_epoch: 35
  freeze_observer_epoch: 40
  freeze_bn_stats_epoch: 45

early_stopping:
  patience: 10
  metric: f1_macro

architectures:
  - resnet50
  - efficientnetv2_s
  - convnext_tiny
  - mobilenetv3

output_dir: results/classification/xsdd
