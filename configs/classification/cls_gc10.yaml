# Scenario A1 (README.md section 3) - GC10-DET only, 10 classes.
experiment_name: "classification/gc10"

dataset:
  name: gc10
  root: data/processed/gc10_cls
  num_classes: 10
  class_names:
    - punching_hole
    - weld_line
    - crescent_gap
    - water_spot
    - oil_spot
    - silk_spot
    - inclusion
    - waist_folding
    - crease
    - rolled_pit

img_size: 224
batch_size: 32
num_workers: 4
epochs: 50
seed: 42

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00001

scheduler:
  name: cosine

loss:
  weighted: false        # GC10 is relatively balanced across classes
  label_smoothing: 0.1

# GC10 is the largest, most balanced dataset here - a plain linear head is sufficient.
head:
  type: linear

quantization:
  enabled: true
  backend: qnnpack
  qat_start_epoch: 35
  freeze_observer_epoch: 40
  freeze_bn_stats_epoch: 45

early_stopping:
  patience: 10
  metric: f1_macro

architectures:
  - resnet50
  - efficientnetv2_s
  - convnext_tiny
  - mobilenetv3

output_dir: results/classification/gc10
