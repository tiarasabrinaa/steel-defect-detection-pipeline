# Scenario B4 - GC10 + NEU-DET combined, 15 classes (X-SDD dropped, no bounding boxes).
experiment_name: "steel-defect/detection/combined"

dataset:
  name: combined
  root: data/combined/detection
  num_classes: 15
  class_names:
    - inclusion                     # merged: GC10 + NEU-DET
    - scratches                     # NEU-DET only (X-SDD dropped from detection)
    - crazing
    - patches
    - pitted_surface
    - rolled-in_scale
    - punching_hole
    - weld_line
    - crescent_gap
    - water_spot
    - oil_spot
    - silk_spot
    - waist_folding
    - crease
    - rolled_pit

img_size: 640
batch_size: 16
epochs: 120
num_workers: 4
seed: 42

frameworks:
  ultralytics:
    architectures: [yolov8s, yolo11s, rtdetr-l]
    optimizer: auto
    lr0: 0.01
  torchvision:
    architectures: [fasterrcnn_resnet50_fpn_v2, retinanet_resnet50_fpn_v2]
    optimizer:
      name: sgd
      lr: 0.005
      momentum: 0.9
      weight_decay: 0.0005

output_dir: results/detection/combined
